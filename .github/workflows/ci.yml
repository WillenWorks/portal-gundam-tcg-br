name: CI

on:
  pull_request:
    branches: [dev, main]
  # commit direto (merge, hotfix) também passa pelo CI — o deploy não espera por ele, mas o vermelho aparece
  push:
    branches: [dev, main]

# o padrão da organização para o GITHUB_TOKEN é escrita; este workflow só lê o código
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # o deploy roda `prisma migrate deploy`: mudança no schema.prisma sem migration chega ao código mas não ao banco
  # (foi o que derrubou o painel do Instagram no #193). Aplica as migrations num Postgres vazio e compara com o schema.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Toda mudança no schema.prisma tem migration
        run: |
          corepack pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://postgres:postgres@localhost:5432/postgres" \
            --script --exit-code \
            || { echo "::error::O schema.prisma tem mudanças sem migration em prisma/migrations (o diff acima mostra o SQL que falta)."; exit 1; }

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: corepack pnpm exec prisma generate

      - name: Type check
        run: corepack pnpm run check:types

      - name: Lint (erros travam; avisos não)
        run: corepack pnpm run lint

      - name: Dependências de produção sem vulnerabilidade alta
        run: corepack pnpm audit --prod --audit-level high

      - name: Unit tests
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm run build

      - name: Testes de ponta a ponta (build de produção + API simulada, desktop e celular)
        run: |
          corepack pnpm exec playwright install --with-deps chromium
          corepack pnpm exec playwright test

      - name: Relatório dos testes de ponta a ponta (se falharem)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-relatorio
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Fuzz (regressão do motor — ~4500 partidas repartidas entre ST01-08, GD01 e os decks meta GD02)
        run: corepack pnpm run gundam:fuzz -- --totalGames=4500

      - name: Golden-master (docs/44 §4.3 — hash do estado final por par; PR que muda regra sem --update falha aqui)
        run: corepack pnpm run gundam:golden

      - name: Cobertura de efeitos (docs/48 — falha se carta sem EffectSpec nem deferimento)
        run: corepack pnpm run catalog:coverage:gate
