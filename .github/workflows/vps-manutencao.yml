name: Manutenção da VPS

# Tarefas de manutenção da VPS de produção, disparadas à mão (Actions → "Manutenção da VPS" → Run workflow).
# Só quem tem acesso de escrita ao repositório consegue disparar. O repositório é público, então o log
# também é: as tarefas imprimem só status, tamanhos e configuração, nunca .env, senhas ou dados.
#
#   diagnostico       só leitura: sistema, disco, memória, pm2, PostgreSQL, nginx do anaheimhub.com
#   logs-api          reinícios do gundam-portal: só as linhas de erro/saída do pm2 (sem e-mails, tokens ou corpo de requisição)
#   investigar-oom    tráfego agregado (rotas sem query/IP, robôs) nos 10 min antes de cada queda por falta de memória
#   backup            pg_dumpall dos bancos + nginx/letsencrypt + .env dos apps + pm2 save, em /root/backups
#   baseline-conferir confere se o banco bate com o prisma/schema.prisma (não altera nada)
#   baseline-aplicar  faz um backup e então troca o histórico de migrations (scripts/prisma-baseline.mjs --yes)

on:
  workflow_dispatch:
    inputs:
      tarefa:
        description: "O que fazer"
        type: choice
        options: [diagnostico, logs-api, investigar-oom, backup, baseline-conferir, baseline-aplicar]
        default: diagnostico

# nunca junto com um deploy ou outra manutenção
concurrency:
  group: vps-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: ${{ inputs.tarefa }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAREFA: ${{ inputs.tarefa }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: TAREFA
          command_timeout: 35m
          # sem script_stop: ele quebra funções e `case` multilinha (o script já usa `set -e`)
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"
            APP=/root/portal-gundam-tcg-br
            secao() { echo; echo "=================== $*"; }

            diagnostico() {
              secao "sistema"
              . /etc/os-release && echo "$PRETTY_NAME"; uname -r; uptime
              [ -f /var/run/reboot-required ] && echo "REINÍCIO PENDENTE" || echo "sem reinício pendente"
              secao "disco e memória"
              df -h / | tail -1; free -m
              secao "pm2"
              pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const p of JSON.parse(s))console.log(`${p.name.padEnd(16)} ${p.pm2_env.status.padEnd(8)} restarts=${p.pm2_env.restart_time} mem=${Math.round((p.monit?.memory||0)/1048576)}MB node=${p.pm2_env.node_version}`)})'
              secao "PostgreSQL"
              pg_lsclusters
              runuser -u postgres -- psql -Atc "select datname, pg_size_pretty(pg_database_size(datname)) from pg_database where not datistemplate order by 1"
              secao "nginx"
              nginx -v 2>&1; nginx -t 2>&1 | tail -1
              ls -l /etc/nginx/sites-enabled/
              echo "--- /etc/nginx/sites-enabled/anaheimhub.com"
              cat /etc/nginx/sites-enabled/anaheimhub.com
              secao "apt"
              apt-get update -qq 2>&1 | grep -E "^(E:|Err)" || echo "apt update sem erros"
              apt list --upgradable 2>/dev/null | tail -n +2 | wc -l | xargs echo "pacotes com atualização:"
              secao "backups existentes"
              ls -1 /root/backups 2>/dev/null || echo "(nenhum)"
            }

            logs_api() {
              secao "pm2 describe gundam-portal"
              pm2 describe gundam-portal | grep -E "status|restarts|unstable restarts|uptime|created at|script path|interpreter|node.js version|max memory|exec mode" | sed 's/│/|/g'
              L=$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s).find(x=>x.name==="gundam-portal");console.log(p.pm2_env.pm_err_log_path+" "+p.pm2_env.pm_out_log_path)})')
              ERR=${L%% *}; OUT=${L##* }
              secao "erros fatais/saídas (últimos 7 dias, sem dados pessoais)"
              # só linhas de erro de processo; e-mails/tokens trocados por ***
              grep -ahE "FATAL|heap|out of memory|Killed|SIGKILL|SIGTERM|exited|exit code|Unhandled|uncaught|EADDRINUSE|ECONNREFUSED|PrismaClient|Error:" "$ERR" "$OUT" 2>/dev/null \
                | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***@***/g; s/(token|password|senha|secret|authorization)[^ ]*/\1=***/Ig' \
                | cut -c1-220 | tail -n 60
              secao "pm2 log do daemon (reinícios)"
              grep -aE "gundam-portal" /root/.pm2/pm2.log 2>/dev/null | grep -aiE "exit|restart|stop|start|kill" | tail -n 30 | cut -c1-200
            }

            investigar_oom() {
              secao "memória dos processos node agora"
              ps -eo rss,etime,args --sort=-rss | grep -E "[n]ode|[t]sx" | head -6 | awk '{printf "%6d MB  %s  ", $1/1024, $2; $1="";$2=""; print substr($0,1,110)}'
              secao "quedas (exit 134) nos últimos 3 dias"
              grep -a "gundam-portal" /root/.pm2/pm2.log | grep -a "code \[134\]" | tail -n 12 | cut -c1-19 > /tmp/oom-times.txt
              cat /tmp/oom-times.txt
              LOGS=$(ls -1 /var/log/nginx/access.log /var/log/nginx/access.log.1 2>/dev/null)
              zcat -f /var/log/nginx/access.log.2.gz 2>/dev/null > /tmp/acc-old.log || true
              while read -r T; do
                [ -z "$T" ] && continue
                END=$(date -u -d "${T/T/ }" +%s); START=$((END - 600))
                secao "10 min antes da queda de $T UTC"
                cat $LOGS /tmp/acc-old.log 2>/dev/null | node -e '
                  const [start,end]=process.argv.slice(1).map(Number); const M={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
                  const paths=new Map(), bots=new Map(); let n=0;
                  require("readline").createInterface({input:process.stdin}).on("line",l=>{
                    const m=l.match(/\[(\d+)\/(\w+)\/(\d+):(\d+):(\d+):(\d+) ([+-]\d{4})\] "(\w+) ([^ "]*)[^"]*" (\d+) (\d+) "[^"]*" "([^"]*)"/); if(!m) return;
                    const off=(m[7][0]==="-"?-1:1)*(Number(m[7].slice(1,3))*60+Number(m[7].slice(3)));
                    const t=Date.UTC(+m[3],M[m[2]],+m[1],+m[4],+m[5],+m[6])/1000-off*60; if(t<start||t>end) return;
                    n++; const p=m[8]+" "+m[9].split("?")[0].replace(/\/c[a-z0-9]{20,}/g,"/:id").replace(/\/[A-Z]{2,4}\d{2}-\d{3}\w*/g,"/:code").replace(/\/\d+/g,"/:n");
                    const e=paths.get(p)||{c:0,b:0}; e.c++; e.b+=Number(m[11]); paths.set(p,e);
                    const ua=(m[12].match(/(Googlebot|bingbot|YandexBot|AhrefsBot|SemrushBot|GPTBot|ClaudeBot|Bytespider|facebookexternalhit|curl|python|Go-http|node|axios|UptimeRobot|bot|crawler|spider)/i)||["navegador"])[0];
                    bots.set(ua,(bots.get(ua)||0)+1);
                  }).on("close",()=>{
                    console.log("requisições:",n);
                    console.log("agentes:",[...bots].sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>k+"="+v).join(" "));
                    for(const [p,e] of [...paths].sort((a,b)=>b[1].b-a[1].b).slice(0,8)) console.log(String(e.c).padStart(5),(e.b/1048576).toFixed(1).padStart(7)+"MB",p.slice(0,90));
                  });' $START $END
              done < /tmp/oom-times.txt
            }

            backup() {
              D=/root/backups/$(date +%F-%H%M)
              mkdir -p "$D/patanet" && chmod 700 /root/backups "$D"
              secao "backup em $D"
              runuser -u postgres -- pg_dumpall | gzip > "$D/pg_dumpall.sql.gz"
              gunzip -t "$D/pg_dumpall.sql.gz"
              echo "bancos no dump: $(zcat "$D/pg_dumpall.sql.gz" | grep -c '^CREATE DATABASE')"
              tar czf "$D/nginx-letsencrypt.tgz" /etc/nginx /etc/letsencrypt 2>/dev/null
              cp "$APP/.env" "$D/env-anaheimhub"
              (cd /root/patanet-deploy && find . -maxdepth 4 -name ".env*" -not -path "*/node_modules/*" -exec cp --parents {} "$D/patanet/" \;)
              pm2 save >/dev/null && cp /root/.pm2/dump.pm2 "$D/" 2>/dev/null || true
              dpkg --get-selections > "$D/pacotes.txt"
              chmod -R go-rwx "$D"
              ls -lh "$D" "$D/patanet" | grep -v '^total'
              # mantém os 5 backups mais recentes
              ls -1d /root/backups/*/ | head -n -5 | xargs -r rm -rf
            }

            case "$TAREFA" in
              diagnostico) diagnostico ;;
              logs-api) logs_api ;;
              investigar-oom) investigar_oom ;;
              backup) backup ;;
              baseline-conferir) cd "$APP" && node scripts/prisma-baseline.mjs ;;
              baseline-aplicar) backup; cd "$APP" && node scripts/prisma-baseline.mjs --yes ;;
              *) echo "tarefa desconhecida: $TAREFA"; exit 1 ;;
            esac
