name: Manutenção da VPS

# Tarefas de manutenção da VPS de produção, disparadas à mão (Actions → "Manutenção da VPS" → Run workflow).
# Só quem tem acesso de escrita ao repositório consegue disparar. O repositório é público, então o log
# também é: as tarefas imprimem só status, tamanhos e configuração, nunca .env, senhas ou dados.
#
#   diagnostico       só leitura: sistema, disco, memória, pm2, PostgreSQL, nginx do anaheimhub.com
#   logs-api          reinícios do gundam-portal: só as linhas de erro/saída do pm2 (sem e-mails, tokens ou corpo de requisição)
#   investigar-oom    tráfego agregado (rotas sem query/IP, robôs) nos 10 min antes de cada queda por falta de memória
#   monitorar-memoria 25 min de amostras de memória do processo da API + atividade do simulador (só contagens)
#   nginx-aplicar     instala deploy/nginx/anaheimhub.com.conf (guarda o anterior; `nginx -t` falhou → volta o anterior)
#   backup            pg_dumpall dos bancos + nginx/letsencrypt + .env dos apps + pm2 save, em /root/backups
#   baseline-conferir confere se o banco bate com o prisma/schema.prisma (não altera nada)
#   baseline-aplicar  faz um backup e então troca o histórico de migrations (scripts/prisma-baseline.mjs --yes)
#   seguranca-conferir só leitura: exposição de portas, firewall, SSH, backups (só sim/não e contagens)
#   upgrade-preparar  só leitura: o que o upgrade de versão do Ubuntu vai encontrar
#   upgrade-executar  em segundo plano (systemd-run, unidade temporária): com atualizações pendentes, instala e
#                     reinicia; sem pendências no 25.04, faz o do-release-upgrade não interativo (mantém as configs
#                     e não remove pacotes obsoletos, como o PostgreSQL 17) e reinicia
#   upgrade-status    andamento do upgrade + saúde do AnaheimHub e da Patanet
#   backup-externo-configurar  grava o token do Google Drive e a senha (segredos RCLONE_DRIVE_TOKEN e
#                     BACKUP_PASSPHRASE), agenda o backup diário criptografado no Drive e roda o primeiro
#   backup-externo-testar      baixa o backup mais recente do Drive, descriptografa e confere

on:
  workflow_dispatch:
    inputs:
      tarefa:
        description: "O que fazer"
        type: choice
        options: [diagnostico, seguranca-conferir, upgrade-preparar, upgrade-executar, upgrade-status, backup-externo-configurar, backup-externo-testar, postgres-18, fail2ban-instalar, logs-api, investigar-oom, monitorar-memoria, nginx-aplicar, backup, baseline-conferir, baseline-aplicar, bug-reports]
        default: diagnostico

# nunca junto com um deploy ou outra manutenção
concurrency:
  group: vps-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        if: inputs.tarefa == 'nginx-aplicar'
      - name: Envia a configuração do nginx
        if: inputs.tarefa == 'nginx-aplicar'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: deploy/nginx/anaheimhub.com.conf
          target: /root/nginx-novo
          strip_components: 2
          overwrite: true
      - name: ${{ inputs.tarefa }}
        uses: appleboy/ssh-action@v1.2.5
        env:
          TAREFA: ${{ inputs.tarefa }}
          # os segredos do backup externo só chegam à VPS na tarefa que os grava
          # nome diferente do segredo: o rclone trataria RCLONE_DRIVE_* do ambiente como opção do backend
          BACKUP_DRIVE_TOKEN: ${{ inputs.tarefa == 'backup-externo-configurar' && secrets.RCLONE_DRIVE_TOKEN || '' }}
          BACKUP_PASSPHRASE: ${{ inputs.tarefa == 'backup-externo-configurar' && secrets.BACKUP_PASSPHRASE || '' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: TAREFA,BACKUP_DRIVE_TOKEN,BACKUP_PASSPHRASE
          command_timeout: 35m
          # sem script_stop: ele quebra funções e `case` multilinha (o script já usa `set -e`)
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"
            APP=/root/portal-gundam-tcg-br
            secao() { echo; echo "=================== $*"; }

            diagnostico() {
              secao "sistema"
              . /etc/os-release && echo "$PRETTY_NAME"; uname -r; uptime
              [ -f /var/run/reboot-required ] && echo "REINÍCIO PENDENTE" || echo "sem reinício pendente"
              secao "disco e memória"
              df -h / | tail -1; free -m
              secao "pm2"
              pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const p of JSON.parse(s))console.log(`${p.name.padEnd(16)} ${p.pm2_env.status.padEnd(8)} restarts=${p.pm2_env.restart_time} mem=${Math.round((p.monit?.memory||0)/1048576)}MB node=${p.pm2_env.node_version}`)})'
              P=$(pgrep -f -- "--require .*tsx" | head -1)
              [ -n "$P" ] && echo "API: $(ps -o rss=,etime= -p "$P" | awk '{printf "%d MB, no ar há %s", $1/1024, $2}') · $(tr '\0' '\n' < /proc/$P/environ | grep '^NODE_OPTIONS=' || echo 'sem NODE_OPTIONS')"
              [ -n "$P" ] && echo "API, ambiente do processo: $(tr '\0' '\n' < /proc/$P/environ | grep -E '^(NODE_ENV|API_HOST|SENTRY_ENABLED)=' | tr '\n' ' ' || true)"
              # só sim/não, nunca o valor
              E="$APP/.env"
              echo ".env: NODE_ENV=production $(grep -qE '^NODE_ENV=\"?production' "$E" && echo sim || echo não) · ALLOWED_ORIGINS definido $(grep -qE '^ALLOWED_ORIGINS=\"?[^\" ]' "$E" && echo sim || echo não) · JWT_SECRET próprio $(grep -E '^JWT_SECRET=' "$E" | grep -qvE 'change-this-secret|^JWT_SECRET=\"?\"?$' && echo sim || echo não)"
              secao "PostgreSQL"
              pg_lsclusters
              runuser -u postgres -- psql -Atc "select datname, pg_size_pretty(pg_database_size(datname)) from pg_database where not datistemplate order by 1"
              runuser -u postgres -- psql -d gundam_portal -Atc "select 'torneios ativos', count(*) from \"Tournament\" where \"isActive\" union all select 'participações', count(*) from \"TournamentEntry\" union all select 'participações com lista', count(*) from \"TournamentEntry\" where \"deckSnapshotId\" is not null union all select 'itens de listas', count(*) from \"DeckSnapshotItem\""
              secao "nginx"
              nginx -v 2>&1; nginx -t 2>&1 | tail -1
              ls -l /etc/nginx/sites-enabled/
              echo "--- /etc/nginx/sites-enabled/anaheimhub.com"
              cat /etc/nginx/sites-enabled/anaheimhub.com
              secao "apt"
              apt-get update -qq 2>&1 | grep -E "^(E:|Err)" || echo "apt update sem erros"
              apt list --upgradable 2>/dev/null | tail -n +2 | wc -l | xargs echo "pacotes com atualização:"
              secao "backups existentes"
              ls -1 /root/backups 2>/dev/null || echo "(nenhum)"
            }

            logs_api() {
              secao "pm2 describe gundam-portal"
              pm2 describe gundam-portal | grep -E "status|restarts|unstable restarts|uptime|created at|script path|interpreter|node.js version|max memory|exec mode" | sed 's/│/|/g'
              L=$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s).find(x=>x.name==="gundam-portal");console.log(p.pm2_env.pm_err_log_path+" "+p.pm2_env.pm_out_log_path)})')
              ERR=${L%% *}; OUT=${L##* }
              secao "erros fatais/saídas (últimos 7 dias, sem dados pessoais)"
              # só linhas de erro de processo; e-mails/tokens trocados por ***
              grep -ahE "FATAL|heap|out of memory|Killed|SIGKILL|SIGTERM|exited|exit code|Unhandled|uncaught|EADDRINUSE|ECONNREFUSED|PrismaClient|Error:" "$ERR" "$OUT" 2>/dev/null \
                | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***@***/g; s/(token|password|senha|secret|authorization)[^ ]*/\1=***/Ig' \
                | cut -c1-220 | tail -n 60
              secao "pm2 log do daemon (reinícios)"
              grep -aE "gundam-portal" /root/.pm2/pm2.log 2>/dev/null | grep -aiE "exit|restart|stop|start|kill" | tail -n 30 | cut -c1-200
            }

            investigar_oom() {
              secao "memória dos processos node agora"
              ps -eo rss,etime,args --sort=-rss | grep -E "[n]ode|[t]sx" | head -6 | awk '{printf "%6d MB  %s  ", $1/1024, $2; $1="";$2=""; print substr($0,1,110)}'
              secao "quedas (exit 134) nos últimos 3 dias"
              grep -a "gundam-portal" /root/.pm2/pm2.log | grep -a "code \[134\]" | tail -n 12 | cut -c1-19 > /tmp/oom-times.txt
              cat /tmp/oom-times.txt
              LOGS=$(ls -1 /var/log/nginx/access.log /var/log/nginx/access.log.1 2>/dev/null)
              zcat -f /var/log/nginx/access.log.2.gz 2>/dev/null > /tmp/acc-old.log || true
              while read -r T; do
                [ -z "$T" ] && continue
                END=$(date -u -d "${T/T/ }" +%s); START=$((END - 600))
                secao "10 min antes da queda de $T UTC"
                cat $LOGS /tmp/acc-old.log 2>/dev/null | node -e '
                  const [start,end]=process.argv.slice(1).map(Number); const M={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
                  const paths=new Map(), bots=new Map(), falhas=[]; let n=0;
                  require("readline").createInterface({input:process.stdin}).on("line",l=>{
                    const m=l.match(/\[(\d+)\/(\w+)\/(\d+):(\d+):(\d+):(\d+) ([+-]\d{4})\] "(\w+) ([^ "]*)[^"]*" (\d+) (\d+) "[^"]*" "([^"]*)"/); if(!m) return;
                    const off=(m[7][0]==="-"?-1:1)*(Number(m[7].slice(1,3))*60+Number(m[7].slice(3)));
                    const t=Date.UTC(+m[3],M[m[2]],+m[1],+m[4],+m[5],+m[6])/1000-off*60; if(t<start||t>end+60) return;
                    n++; const p=m[8]+" "+m[9].split("?")[0].replace(/\/c[a-z0-9]{20,}/g,"/:id").replace(/\/[A-Z]{2,4}\d{2}-\d{3}\w*/g,"/:code").replace(/\/\d+/g,"/:n");
                    const e=paths.get(p)||{c:0,b:0}; e.c++; e.b+=Number(m[11]); paths.set(p,e);
                    const ua=(m[12].match(/(Googlebot|bingbot|YandexBot|AhrefsBot|SemrushBot|GPTBot|ClaudeBot|Bytespider|facebookexternalhit|curl|python|Go-http|node|axios|UptimeRobot|bot|crawler|spider)/i)||["navegador"])[0];
                    bots.set(ua,(bots.get(ua)||0)+1);
                    if((m[10]==="502"||m[10]==="499"||m[10]==="504") && t>=end-240 && t<=end+60) falhas.push(new Date(t*1000).toISOString().slice(11,19)+" "+m[10]+" "+p.slice(0,100)+" ["+ua+"]");
                  }).on("close",()=>{
                    console.log("requisições:",n);
                    console.log("em andamento quando caiu (502/499/504 de 4 min antes a 1 min depois):"); for (const f of falhas.slice(0,15)) console.log("   "+f);
                    console.log("agentes:",[...bots].sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>k+"="+v).join(" "));
                    for(const [p,e] of [...paths].sort((a,b)=>b[1].b-a[1].b).slice(0,8)) console.log(String(e.c).padStart(5),(e.b/1048576).toFixed(1).padStart(7)+"MB",p.slice(0,90));
                  });' $START $END
              done < /tmp/oom-times.txt
            }

            monitorar_memoria() {
              Q() { runuser -u postgres -- psql -d gundam_portal -Atc "$1"; }
              secao "simulador: partidas e turnos do bot (contagens)"
              Q "select 'partidas abertas (atualizadas 24h)', count(*), coalesce(max(pg_column_size(state))/1024,0)||' KB maior estado' from \"SimulatorMatch\" where \"finishedAt\" is null and \"updatedAt\" > now() - interval '24 hours'"
              Q "select 'partidas abertas (total)', count(*), coalesce(sum(pg_column_size(state))/1048576,0)||' MB' from \"SimulatorMatch\" where \"finishedAt\" is null"
              Q "select 'turnos do bot 24h', status, count(*), max(attempts) from \"SimulatorBotTurn\" where \"createdAt\" > now() - interval '24 hours' group by status"
              Q "select to_char(date_trunc('hour', \"createdAt\"), 'DD HH24')||'h', count(*) from \"SimulatorBotTurn\" where \"createdAt\" > now() - interval '14 hours' group by 1 order by 1"
              secao "memória da API a cada minuto (MB) — 25 min"
              START=$(date -u +%FT%T)
              for i in $(seq 1 25); do
                P=$(pgrep -f "tsx/dist/loader|--require .*tsx" | head -1)
                R=$([ -n "$P" ] && ps -o rss= -p "$P" | awk '{print int($1/1024)}' || echo "-")
                T=$(Q "select count(*) from \"SimulatorBotTurn\" where \"createdAt\" > '$START'")
                M=$(Q "select count(*) from \"SimulatorMatch\" where \"updatedAt\" > now() - interval '1 minute'")
                echo "$(date -u +%H:%M) pid=$P rss=${R}MB turnos_bot_desde_inicio=$T partidas_mexidas_1min=$M"
                sleep 60
              done
            }

            nginx_aplicar() {
              NEW=/root/nginx-novo/anaheimhub.com.conf
              TARGET=$(readlink -f /etc/nginx/sites-enabled/anaheimhub.com)
              [ -s "$NEW" ] || { echo "arquivo novo não chegou"; exit 1; }
              mkdir -p /root/backups && OLD=/root/backups/nginx-anaheimhub.com.$(date +%F-%H%M)
              cp -a "$TARGET" "$OLD"
              secao "diferença (anterior → novo)"
              diff -u "$OLD" "$NEW" | head -n 150 || true
              cp "$NEW" "$TARGET"
              secao "nginx -t"
              if nginx -t 2>&1; then
                systemctl reload nginx && echo "nginx recarregado com a configuração nova"
              else
                cp -a "$OLD" "$TARGET"; nginx -t 2>&1 | tail -1
                echo "CONFIGURAÇÃO NOVA REJEITADA — a anterior foi restaurada"; exit 1
              fi
              sleep 2
              secao "conferência"
              curl -s -o /dev/null -w "https://anaheimhub.com/ → %{http_code}\n" https://anaheimhub.com/
              curl -s -o /dev/null -w "https://www.anaheimhub.com/cards → %{http_code} %{redirect_url}\n" https://www.anaheimhub.com/cards
              curl -s -o /dev/null -w "http://anaheimhub.com/ → %{http_code} %{redirect_url}\n" http://anaheimhub.com/
              curl -s -o /dev/null -w "/api/health → %{http_code}\n" https://anaheimhub.com/api/health
              A=$(curl -s https://anaheimhub.com/ | grep -o '/assets/index-[^"]*\.js' | head -1)
              curl -sI -H 'Accept-Encoding: gzip' "https://anaheimhub.com$A" | grep -iE "^(HTTP|cache-control|content-encoding|server|strict-transport)" 
              curl -sI https://anaheimhub.com/ | grep -iE "^(cache-control|x-frame|x-content|referrer|server)"
            }

            backup() {
              D=/root/backups/$(date +%F-%H%M)
              mkdir -p "$D/patanet" && chmod 700 /root/backups "$D"
              secao "backup em $D"
              runuser -u postgres -- pg_dumpall | gzip > "$D/pg_dumpall.sql.gz"
              gunzip -t "$D/pg_dumpall.sql.gz"
              echo "bancos no dump: $(zcat "$D/pg_dumpall.sql.gz" | grep -c '^CREATE DATABASE')"
              tar czf "$D/nginx-letsencrypt.tgz" /etc/nginx /etc/letsencrypt 2>/dev/null
              cp "$APP/.env" "$D/env-anaheimhub"
              (cd /root/patanet-deploy && find . -maxdepth 4 -name ".env*" -not -path "*/node_modules/*" -exec cp --parents {} "$D/patanet/" \;)
              pm2 save >/dev/null && cp /root/.pm2/dump.pm2 "$D/" 2>/dev/null || true
              dpkg --get-selections > "$D/pacotes.txt"
              chmod -R go-rwx "$D"
              ls -lh "$D" "$D/patanet" | grep -v '^total'
              # mantém os 5 backups mais recentes
              ls -1d /root/backups/*/ | head -n -5 | xargs -r rm -rf
            }

            seguranca_conferir() {
              # repo público: só um resumo sim/não e contagens, sem endereços, portas ou nomes de usuário
              secao "exposição de rede"
              FORA=$(ss -Htln | awk '{print $4}' | grep -vE '^(127\.|\[::1\]|\[::ffff:127\.)' | grep -vE ':(22|80|443)$' | sort -u | wc -l)
              echo "portas TCP escutando fora do localhost além de 22/80/443: $FORA"
              ss -Htln | awk '{print $4}' | grep -qE '^(0\.0\.0\.0|\*|\[::\]):5432$' && echo "PostgreSQL escuta em todas as interfaces: sim" || echo "PostgreSQL escuta em todas as interfaces: não"
              ss -Htln | awk '{print $4}' | grep -qE '^(0\.0\.0\.0|\*|\[::\]):8787$' && echo "API do AnaheimHub escuta em todas as interfaces: sim" || echo "API do AnaheimHub escuta em todas as interfaces: não"
              if command -v ufw >/dev/null; then ufw status | head -1 | sed 's/^/ufw: /'; else echo "ufw: não instalado"; fi
              echo "regras iptables INPUT com DROP/REJECT: $(iptables -S INPUT 2>/dev/null | grep -cE 'DROP|REJECT' || true) · política INPUT: $(iptables -S INPUT 2>/dev/null | head -1 | awk '{print $3}')"
              echo "pg_hba: linhas 'host' liberando qualquer endereço: $(grep -hvE '^\s*(#|$)' /etc/postgresql/*/main/pg_hba.conf | awk '$1 ~ /^host/ && ($4=="all" || $4 ~ /^0\.0\.0\.0/ || $4=="::/0")' | wc -l)"
              secao "SSH"
              sshd -T 2>/dev/null | grep -iE '^(passwordauthentication|permitrootlogin|pubkeyauthentication|kbdinteractiveauthentication) ' || echo "sshd -T indisponível"
              systemctl is-active fail2ban >/dev/null 2>&1 && echo "fail2ban: ativo" || echo "fail2ban: inativo/ausente"
              echo "falhas de login SSH nas últimas 24h: $(journalctl -u ssh -u sshd --since '24 hours ago' 2>/dev/null | grep -ciE 'failed password|invalid user' || true)"
              secao "atualizações automáticas"
              dpkg -l unattended-upgrades 2>/dev/null | grep -q '^ii' && echo "unattended-upgrades: instalado ($(systemctl is-enabled unattended-upgrades 2>/dev/null))" || echo "unattended-upgrades: ausente"
              secao "backups"
              echo "backups locais: $(ls -1d /root/backups/*/ 2>/dev/null | wc -l) · mais recente: $(ls -1td /root/backups/*/ 2>/dev/null | head -1 | xargs -r basename)"
              echo "dumps diários (.sql/.gz soltos em /root/backups): $(ls -1 /root/backups/*.sql* 2>/dev/null | wc -l) · mais recente: $(ls -1t /root/backups/*.sql* 2>/dev/null | head -1 | xargs -r basename)"
              echo "cópia fora da VPS configurada (rclone/restic/aws/s3cmd): $(for c in rclone restic aws s3cmd; do command -v $c >/dev/null && echo -n "$c "; done; crontab -l 2>/dev/null | grep -cE 'rclone|restic|s3|scp|rsync' ) "
              echo "tarefas no crontab do root: $(crontab -l 2>/dev/null | grep -cvE '^\s*(#|$)' || true) · com pg_dump: $(crontab -l 2>/dev/null | grep -c pg_dump || true) · timers systemd de backup: $(systemctl list-timers --all 2>/dev/null | grep -ciE 'backup|dump' || true)"
            }

            upgrade_preparar() {
              # só leitura: o que o upgrade de versão do Ubuntu vai encontrar
              secao "versão e caminho de upgrade"
              . /etc/os-release && echo "$PRETTY_NAME"
              grep -E '^Prompt=' /etc/update-manager/release-upgrades 2>/dev/null || echo "sem /etc/update-manager/release-upgrades"
              command -v do-release-upgrade >/dev/null && echo "do-release-upgrade: presente" || echo "do-release-upgrade: AUSENTE (pacote ubuntu-release-upgrader-core)"
              timeout 60 do-release-upgrade -c 2>&1 | tail -3 || true
              secao "pacotes"
              apt-mark showhold | wc -l | xargs echo "pacotes retidos (hold):"
              dpkg --audit 2>&1 | head -3; echo "dpkg --audit acima (vazio = ok)"
              apt list --upgradable 2>/dev/null | tail -n +2 | wc -l | xargs echo "atualizações pendentes na versão atual:"
              secao "repositórios de terceiros"
              ls /etc/apt/sources.list.d/ 2>/dev/null
              grep -rhoE 'https?://[^ ]+' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | sort -u
              secao "PostgreSQL"
              dpkg -l 'postgresql*' 2>/dev/null | awk '/^ii/{print $2, $3}'
              apt-cache policy postgresql-17 2>/dev/null | sed -n '1,8p'
              pg_lsclusters
              secao "Node, pm2 e serviços no boot"
              . "$NVM_DIR/nvm.sh" >/dev/null; node -v; pm2 -v
              systemctl list-unit-files 2>/dev/null | grep -E '^pm2|nginx|postgresql' | awk '{print $1, $2}'
              pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const p of JSON.parse(s))console.log(p.name, p.pm2_env.exec_interpreter, p.pm2_env.status)})'
              [ -f /root/.pm2/dump.pm2 ] && echo "pm2 dump salvo: $(date -r /root/.pm2/dump.pm2 +%F)" || echo "pm2 dump: AUSENTE"
              secao "espaço"
              df -h / /boot 2>/dev/null | tail -n +2
              secao "kernel e reinício"
              uname -r; [ -f /var/run/reboot-required ] && echo "REINÍCIO PENDENTE" || echo "sem reinício pendente"
              command -v screen tmux 2>/dev/null | xargs -r echo "multiplexadores:"
              command -v rclone gpg 2>/dev/null | xargs -r echo "rclone/gpg:"
            }

            saude() {
              secao "saúde dos sites"
              for u in https://anaheimhub.com/ https://anaheimhub.com/api/health https://api.patanet.app.br/; do
                curl -s -o /dev/null -m 15 -w "$u → %{http_code}\n" "$u" || echo "$u → sem resposta"
              done
              pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const p of JSON.parse(s))console.log(`${p.name.padEnd(16)} ${p.pm2_env.status.padEnd(8)} restarts=${p.pm2_env.restart_time}`)})'
              pg_lsclusters
              dpkg -l 'postgresql-1*' 2>/dev/null | awk '/^ii/{print $2, $3}'
            }

            upgrade_executar() {
              . /etc/os-release
              if systemctl is-active --quiet upgrade-ubuntu 2>/dev/null; then echo "já há um upgrade rodando"; exit 1; fi
              pm2 save >/dev/null && echo "pm2 save feito (processos e variáveis atuais voltam após o reinício)"
              backup
              # o upgrade não remove pacotes "obsoletos" (o PostgreSQL 17 vira obsoleto no 26.04)
              mkdir -p /etc/update-manager/release-upgrades.d
              printf '[Distro]\nRemoveObsoletes=no\n' > /etc/update-manager/release-upgrades.d/zz-manter-obsoletos.cfg
              apt-get update -qq
              PEND=$(apt list --upgradable 2>/dev/null | tail -n +2 | wc -l)
              if [ "$PEND" -gt 0 ]; then
                FASE="atualizar $VERSION_ID ($PEND pacotes) e reiniciar"
                CMD='env DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold full-upgrade'
              elif [ "$VERSION_ID" = "25.04" ]; then
                FASE="do-release-upgrade 25.04 → 26.04 e reiniciar"
                CMD='do-release-upgrade -f DistUpgradeViewNonInteractive'
              else
                echo "nada a fazer: $PRETTY_NAME sem atualizações pendentes"; return 0
              fi
              secao "iniciando em segundo plano: $FASE"
              systemd-run --unit=upgrade-ubuntu --collect /bin/bash -c "
                exec >>/root/upgrade-ubuntu.log 2>&1
                echo \"=== \$(date -u +%FT%TZ) início: $FASE\"
                if $CMD; then
                  echo \"=== \$(date -u +%FT%TZ) FIM OK — reiniciando\"; sleep 5; systemctl reboot
                else
                  echo \"=== \$(date -u +%FT%TZ) FALHOU (código \$?) — sem reiniciar\"
                fi"
              sleep 20
              echo "serviço do upgrade: $(systemctl is-active upgrade-ubuntu 2>/dev/null || true)"
              tail -n 5 /root/upgrade-ubuntu.log | cut -c1-200
            }

            upgrade_status() {
              secao "sistema"
              . /etc/os-release && echo "$PRETTY_NAME"; uname -r; uptime
              echo "serviço do upgrade: $(systemctl is-active upgrade-ubuntu 2>/dev/null || true)"
              [ -f /var/run/reboot-required ] && echo "REINÍCIO PENDENTE" || echo "sem reinício pendente"
              secao "log do upgrade (marcos e últimas linhas)"
              grep -aE '^=== ' /root/upgrade-ubuntu.log 2>/dev/null | tail -n 10
              tail -n 20 /root/upgrade-ubuntu.log 2>/dev/null | cut -c1-200
              secao "erros no log do do-release-upgrade"
              grep -ahE '^(ERROR|CRITICAL)' /var/log/dist-upgrade/main.log 2>/dev/null | tail -n 15 | cut -c1-200 || true
              saude
            }

            backup_externo_configurar() {
              [ -n "$BACKUP_DRIVE_TOKEN" ] || { echo "falta o segredo RCLONE_DRIVE_TOKEN no repositório"; exit 1; }
              [ ${#BACKUP_PASSPHRASE} -ge 20 ] || { echo "falta o segredo BACKUP_PASSPHRASE (mínimo 20 caracteres)"; exit 1; }
              command -v rclone >/dev/null || DEBIAN_FRONTEND=noninteractive apt-get install -y -qq rclone >/dev/null
              rclone version | head -1
              umask 077
              mkdir -p /root/.config/rclone /root/.config/backup-externo
              # o `rclone authorize` novo entrega o token em base64 (às vezes dentro de {"token": "..."}); o antigo, em JSON
              TOKEN_JSON=$(printf '%s' "$BACKUP_DRIVE_TOKEN" | python3 -c '
            import base64, json, sys
            raw = sys.stdin.read().strip()
            def as_json(s):
                try:
                    return json.loads(s)
                except Exception:
                    return None
            obj = as_json(raw)
            if obj is None:
                obj = as_json(base64.urlsafe_b64decode(raw + "=" * (-len(raw) % 4)).decode())
            if isinstance(obj, dict) and "access_token" not in obj and isinstance(obj.get("token"), str):
                obj = json.loads(obj["token"])
            if not (isinstance(obj, dict) and obj.get("refresh_token")):
                sys.exit("token do Drive em formato inesperado (sem refresh_token)")
            print(json.dumps(obj, separators=(",", ":")))
            ')
              printf '[gdrive]\ntype = drive\nscope = drive.file\ntoken = %s\n' "$TOKEN_JSON" > /root/.config/rclone/rclone.conf
              unset BACKUP_DRIVE_TOKEN TOKEN_JSON
              printf '%s' "$BACKUP_PASSPHRASE" > /root/.config/backup-externo/senha
              cat > /usr/local/sbin/backup-externo.sh <<'SCRIPT'
            #!/bin/bash
            # backup diário criptografado (gpg simétrico, AES-256) no Google Drive; guarda 30 dias
            set -euo pipefail
            D=$(date -u +%F)
            T=$(mktemp -d /root/.backup-externo-XXXX); trap 'rm -rf "$T"' EXIT
            G="gpg --batch --yes --pinentry-mode loopback --passphrase-file /root/.config/backup-externo/senha --symmetric --cipher-algo AES256"
            runuser -u postgres -- pg_dumpall | gzip | $G -o "$T/bancos-$D.sql.gz.gpg"
            ENVS=$(find /root/portal-gundam-tcg-br /root/patanet-deploy -maxdepth 4 -name ".env*" -not -path "*/node_modules/*" 2>/dev/null || true)
            tar czf - /etc/nginx /etc/letsencrypt /root/.pm2/dump.pm2 $ENVS 2>/dev/null | $G -o "$T/config-$D.tgz.gpg"
            rclone copy "$T" "gdrive:anaheimhub-backups/$D"
            rclone delete gdrive:anaheimhub-backups --min-age 30d
            rclone rmdirs gdrive:anaheimhub-backups --leave-root
            echo "$(date -u +%FT%TZ) ok: $(du -ch "$T"/* | tail -1 | cut -f1)"
            SCRIPT
              chmod 700 /usr/local/sbin/backup-externo.sh
              echo '30 6 * * * root /usr/local/sbin/backup-externo.sh >> /var/log/backup-externo.log 2>&1' > /etc/cron.d/backup-externo
              chmod 644 /etc/cron.d/backup-externo
              secao "primeiro backup"
              /usr/local/sbin/backup-externo.sh >> /var/log/backup-externo.log 2>&1 || { tail -n 5 /var/log/backup-externo.log | cut -c1-200; echo "PRIMEIRO BACKUP FALHOU"; exit 1; }
              tail -n 1 /var/log/backup-externo.log
              secao "no Drive (pasta anaheimhub-backups)"
              rclone lsl gdrive:anaheimhub-backups | tail -n 6
              echo "agendado: todo dia às 06:30 do relógio da VPS ($(date +%Z))"
            }

            backup_externo_testar() {
              U=$(rclone lsf --dirs-only gdrive:anaheimhub-backups | sort | tail -1)
              [ -n "$U" ] || { echo "nenhum backup no Drive"; exit 1; }
              T=$(mktemp -d /root/.teste-XXXX); trap 'rm -rf "$T"' EXIT
              rclone copy "gdrive:anaheimhub-backups/$U" "$T"
              secao "backup $U"
              ls -lh "$T" | tail -n +2 | awk '{print $5, $9}'
              GD="gpg --batch --quiet --pinentry-mode loopback --passphrase-file /root/.config/backup-externo/senha -d"
              $GD "$T"/bancos-*.gpg | gunzip | grep -c '^CREATE DATABASE' | xargs echo "bancos no dump:"
              $GD "$T"/config-*.gpg | tar tzf - | wc -l | xargs echo "arquivos de configuração:"
              tail -n 3 /var/log/backup-externo.log 2>/dev/null || true
            }

            contagens_pg() {
              Q() { runuser -u postgres -- psql -p "$1" -d "$2" -Atc "$3"; }
              echo "gundam_portal: $(Q "$1" gundam_portal "select (select count(*) from \"Tournament\")||' torneios, '||(select count(*) from \"TournamentEntry\")||' participações, '||(select count(*) from \"User\")||' usuários, '||(select count(*) from \"Deck\")||' decks'")"
              echo "patanet_prod: $(Q "$1" patanet_prod "select count(*)||' tabelas' from information_schema.tables where table_schema not in ('pg_catalog','information_schema')") · linhas: $(Q "$1" patanet_prod "select coalesce(sum(n_live_tup),0) from pg_stat_user_tables")"
            }

            postgres_18() {
              # PostgreSQL 17 → 18 com pg_upgradecluster (pg_upgrade em modo cópia: o cluster 17 fica intacto, parado, para voltar)
              pg_lsclusters
              if pg_lsclusters -h | awk '$1==18' | grep -q .; then echo "já existe um cluster 18 — nada a fazer"; pg_lsclusters; return 0; fi
              secao "antes (17, porta 5432)"
              contagens_pg 5432 > /tmp/pg-antes.txt; cat /tmp/pg-antes.txt
              secao "backups antes de migrar"
              backup
              /usr/local/sbin/backup-externo.sh >> /var/log/backup-externo.log 2>&1 && tail -n 1 /var/log/backup-externo.log || { echo "backup externo falhou — parando"; exit 1; }
              secao "parando os apps (evita escrita durante a cópia)"
              pm2 stop gundam-portal nestjs-app >/dev/null && echo "apps parados"
              secao "pg_upgradecluster 17 main → 18"
              START=$(date +%s)
              if ! pg_upgradecluster -m upgrade -v 18 17 main 2>&1 | grep -vE '^\s*$' | tail -n 25 | cut -c1-200; then :; fi
              if pg_lsclusters -h | awk '$1==18 && $2=="main" && $3==5432 && $4 ~ /online/' | grep -q .; then
                echo "migração concluída em $(( $(date +%s) - START ))s"
              else
                echo "MIGRAÇÃO FALHOU — voltando para o 17"
                pg_lsclusters
                pg_ctlcluster 18 main stop 2>/dev/null || true
                pg_lsclusters -h | awk '$1==18' | grep -q . && pg_dropcluster 18 main 2>/dev/null || true
                pg_conftool 17 main set port 5432 2>/dev/null || true
                pg_ctlcluster 17 main start || true
                pm2 start gundam-portal nestjs-app >/dev/null; sleep 5; saude; exit 1
              fi
              secao "depois (18, porta 5432)"
              contagens_pg 5432 > /tmp/pg-depois.txt; cat /tmp/pg-depois.txt
              if diff -q /tmp/pg-antes.txt /tmp/pg-depois.txt >/dev/null; then echo "contagens iguais antes e depois"; else echo "ATENÇÃO: contagens diferentes"; diff /tmp/pg-antes.txt /tmp/pg-depois.txt || true; fi
              secao "estatísticas do planejador (vacuumdb --analyze-in-stages)"
              runuser -u postgres -- vacuumdb --all --analyze-in-stages -p 5432 2>&1 | tail -n 3
              secao "religando os apps"
              pm2 start gundam-portal nestjs-app >/dev/null && pm2 save >/dev/null && echo "apps religados e pm2 salvo"
              sleep 15
              saude
              echo "cluster 17 mantido parado (porta 5433) para voltar, se precisar; apagar depois com pg_dropcluster 17 main"
            }

            fail2ban_instalar() {
              command -v fail2ban-client >/dev/null || DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fail2ban >/dev/null
              # SSH: 5 erros em 10 min → bloqueio de 10 min (curto, para não trancar ninguém por muito tempo)
              printf '[DEFAULT]\nbantime = 10m\nfindtime = 10m\nmaxretry = 5\nbackend = systemd\n\n[sshd]\nenabled = true\n' > /etc/fail2ban/jail.d/anaheimhub.local
              systemctl enable --now fail2ban >/dev/null 2>&1
              systemctl restart fail2ban
              sleep 3
              echo "fail2ban: $(systemctl is-active fail2ban) · jails: $(fail2ban-client status | sed -n 's/.*Jail list:\s*//p')"
              fail2ban-client status sshd | grep -E "Currently banned|Total banned" | sed 's/^[^A-Z]*//'
            }

            bug_reports() {
              secao "bug-reports em disco (antes)"
              find "$APP/bug-reports" -maxdepth 2 2>/dev/null || echo "sem pasta bug-reports"
              secao "marcando BUG-8STNFY e BUG-CVKER1 como fixed no banco"
              sudo -u postgres psql -d gundam_portal -c "UPDATE \"SimulatorBugReport\" SET status = 'fixed', \"prUrl\" = 'https://github.com/WillenWorks/portal-gundam-tcg-br/pull/161', note = 'Corrigido no PR #161 e deploy em produção efetuado.' WHERE \"shortCode\" IN ('BUG-8STNFY', 'BUG-CVKER1');" || true
              sudo -u postgres psql -d gundam_portal -c "SELECT \"shortCode\", status, \"prUrl\", note, \"createdAt\" FROM \"SimulatorBugReport\" WHERE \"shortCode\" IN ('BUG-8STNFY', 'BUG-CVKER1');" || true
              secao "removendo pastas dos relatos corrigidos do disco"
              for code in BUG-8STNFY BUG-CVKER1; do
                rm -rf $APP/bug-reports/*${code}* 2>/dev/null || true
              done
              secao "bug-reports em disco (depois)"
              find "$APP/bug-reports" -maxdepth 2 2>/dev/null || echo "sem pasta bug-reports"
            }

            case "$TAREFA" in
              bug-reports) bug_reports ;;
              diagnostico) diagnostico ;;
              seguranca-conferir) seguranca_conferir ;;
              upgrade-preparar) upgrade_preparar ;;
              upgrade-executar) upgrade_executar ;;
              upgrade-status) upgrade_status ;;
              backup-externo-configurar) backup_externo_configurar ;;
              backup-externo-testar) backup_externo_testar ;;
              postgres-18) postgres_18 ;;
              fail2ban-instalar) fail2ban_instalar ;;
              logs-api) logs_api ;;
              investigar-oom) investigar_oom ;;
              monitorar-memoria) monitorar_memoria ;;
              nginx-aplicar) nginx_aplicar ;;
              backup) backup ;;
              baseline-conferir) cd "$APP" && node scripts/prisma-baseline.mjs ;;
              baseline-aplicar) backup; cd "$APP" && node scripts/prisma-baseline.mjs --yes ;;
              *) echo "tarefa desconhecida: $TAREFA"; exit 1 ;;
            esac
