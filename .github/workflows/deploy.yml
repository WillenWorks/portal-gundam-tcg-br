name: Deploy Production (AnaheimHub)

on:
  push:
    branches:
      - main

# o padrão da organização para o GITHUB_TOKEN é escrita; este workflow só lê o código
permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Deploy atômico:
      # - o site é compilado numa pasta nova (/root/anaheimhub-releases/<versão>) e só entra no ar com a troca
      #   de um link (dist → pasta nova), de uma vez; quem está com a página aberta não vê arquivo pela metade;
      # - os arquivos JS/CSS da versão anterior são copiados para a nova, então abas abertas antes do deploy
      #   continuam carregando as telas sob demanda;
      # - build que falha não mexe no banco nem no site; API que não volta saudável → volta a versão anterior;
      # - guarda as 5 versões mais recentes.
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 18m
          # sem script_stop: ele quebra blocos multilinha; o script usa `set -e` e trata as falhas
          script: |
            set -e
            echo "🚀 Iniciando deploy em produção..."
            # Sessão SSH não interativa não lê o .bashrc: carregar o nvm (node/pnpm/pm2 vêm dele)
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"
            APP=/root/portal-gundam-tcg-br
            RELEASES=/root/anaheimhub-releases
            mkdir -p "$RELEASES"
            cd "$APP"

            PREV_SHA=$(git rev-parse HEAD)
            # versão no ar agora (link ou, antes do primeiro deploy atômico, a pasta dist de verdade)
            PREV_DIST=$(readlink -f dist 2>/dev/null || true)

            volta_codigo() {
              echo "↩️  voltando o código para ${PREV_SHA:0:7}"
              git reset -q --hard "$PREV_SHA"
              # sem NODE_ENV=production aqui: com ele o pnpm não instala as devDependencies (tsx, prisma, vite)
              env -u NODE_ENV pnpm install --frozen-lockfile >/dev/null
              env -u NODE_ENV pnpm exec prisma generate >/dev/null
            }

            # 1. Código novo e dependências exatas
            git fetch -q origin main
            git reset -q --hard origin/main
            SHA=$(git rev-parse --short HEAD)
            pnpm install --frozen-lockfile

            # 2. Compilar o site numa pasta nova (com as variáveis do .env da VPS). Falhou → nada mudou no ar.
            REL="$RELEASES/$(date -u +%Y%m%d-%H%M%S)-$SHA"
            if ! { pnpm exec prisma generate && pnpm exec tsc -b && pnpm exec vite build --outDir "$REL" --emptyOutDir; }; then
              echo "❌ build falhou — banco e site intactos"
              rm -rf "$REL"; volta_codigo; exit 1
            fi

            # 3. Arquivos da versão anterior continuam disponíveis para abas abertas antes do deploy
            if [ -n "$PREV_DIST" ] && [ -d "$PREV_DIST/assets" ]; then cp -rn "$PREV_DIST/assets/." "$REL/assets/"; fi

            # 4. Sitemap com as páginas de detalhe do banco (best-effort: nunca derruba o deploy)
            node scripts/generate-sitemap.mjs --out="$REL/sitemap.xml" || true

            # 5. Sincronizar schema do banco: `migrate deploy` (ver scripts/prisma-sync.mjs)
            pnpm run prisma:sync

            # 6. Publicar: troca atômica do link dist → pasta nova (na primeira vez, a pasta antiga vira uma versão)
            if [ -d dist ] && [ ! -L dist ]; then
              mv dist "$RELEASES/00000000-000000-antes-do-deploy-atomico"
              PREV_DIST="$RELEASES/00000000-000000-antes-do-deploy-atomico"
            fi
            ln -sfn "$REL" dist.novo && mv -Tf dist.novo dist
            echo "site publicado: $(basename "$REL")"

            # 7. Reiniciar a API no PM2
            # teto de heap do Node: o pm2 roda a API via bash/pnpm, então `--max-old-space-size` como argumento do
            # interpretador não chegava ao Node — vai por NODE_OPTIONS (o --update-env leva pro processo)
            export NODE_OPTIONS="--max-old-space-size=3072"
            # produção explícita no processo da API: checagens de JWT_SECRET e ALLOWED_ORIGINS no boot (o .env já
            # tem os dois — conferido pelo diagnóstico), API só em 127.0.0.1 e Sentry da API ligado.
            # Exportado só aqui, depois do install/build (com NODE_ENV=production o pnpm pularia as devDependencies).
            export NODE_ENV=production API_HOST=127.0.0.1 SENTRY_ENABLED=true
            pm2 reload gundam-portal --update-env

            # 8. Conferir: API e uma página do site respondendo. Não voltou em ~90 s → versão anterior.
            OK=""
            for i in $(seq 1 30); do
              if curl -sf -o /dev/null -m 5 http://127.0.0.1:8787/api/health && curl -sf -o /dev/null -m 10 https://anaheimhub.com/cards; then OK=1; break; fi
              sleep 3
            done
            if [ -z "$OK" ]; then
              echo "❌ API não respondeu depois do deploy — voltando a versão anterior"
              volta_codigo
              if [ -n "$PREV_DIST" ]; then ln -sfn "$PREV_DIST" dist.novo && mv -Tf dist.novo dist; fi
              pm2 reload gundam-portal --update-env
              exit 1
            fi
            pm2 save >/dev/null

            # 9. Guardar as 5 versões mais recentes (nunca apaga a que está no ar)
            ATUAL=$(readlink -f dist)
            ls -1dt "$RELEASES"/*/ | sed 's:/$::' | tail -n +6 | while read -r d; do
              if [ "$d" != "$ATUAL" ]; then rm -rf "$d"; fi
            done

            echo "✅ Deploy concluído com sucesso! ($SHA)"
