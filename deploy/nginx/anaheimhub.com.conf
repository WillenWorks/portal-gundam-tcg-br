# nginx do anaheimhub.com — aplicado na VPS pelo workflow "Manutenção da VPS" (tarefa nginx-aplicar), que
# guarda o arquivo anterior, roda `nginx -t` e só recarrega se passar (senão volta o anterior).
# Certificados: os mesmos do Certbot (renovação automática segue funcionando).

# www → domínio principal (canonical único pro Google)
server {
    listen 443 ssl;
    server_name www.anaheimhub.com;
    ssl_certificate /etc/letsencrypt/live/anaheimhub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anaheimhub.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://anaheimhub.com$request_uri;
}

server {
    listen 443 ssl;
    server_name anaheimhub.com;
    root /root/portal-gundam-tcg-br/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/anaheimhub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anaheimhub.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # compressão de texto (a API já manda JSON compactado; aqui é HTML/JS/CSS/SVG/XML)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # cabeçalhos de segurança (repetidos nos blocos que definem add_header próprio, senão o nginx descarta)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    # Frontend (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html sempre revalidado (aponta para os arquivos novos depois de cada deploy)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # arquivos do build com hash no nome: cache longo
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket do Simulador
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Uploads de imagens
    location /uploads/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP → HTTPS (domínio principal)
server {
    listen 80;
    server_name anaheimhub.com www.anaheimhub.com;
    server_tokens off;
    return 301 https://anaheimhub.com$request_uri;
}
