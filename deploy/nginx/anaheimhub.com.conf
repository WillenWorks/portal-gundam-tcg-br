# nginx do anaheimhub.com — aplicado na VPS pelo workflow "Manutenção da VPS" (tarefa nginx-aplicar), que
# guarda o arquivo anterior, roda `nginx -t` e só recarrega se passar (senão volta o anterior).
# Certificados: os mesmos do Certbot (renovação automática segue funcionando).
#
# `root` aponta para /root/portal-gundam-tcg-br/dist, que desde o deploy atômico é um link para a versão
# publicada em /root/anaheimhub-releases/<versão> (ver .github/workflows/deploy.yml).

# Limite de requisições por IP na API (folgado: navegação normal faz poucas por segundo; robô abusivo para aqui)
limit_req_zone $binary_remote_addr zone=anaheimhub_api:10m rate=20r/s;

# WebSocket: só pede "upgrade" quando o navegador pediu
map $http_upgrade $anaheimhub_connection_upgrade {
    default upgrade;
    ""      "";
}

# www → domínio principal (canonical único pro Google)
server {
    listen 443 ssl;
    server_name www.anaheimhub.com;
    ssl_certificate /etc/letsencrypt/live/anaheimhub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anaheimhub.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://anaheimhub.com$request_uri;
}

server {
    listen 443 ssl;
    server_name anaheimhub.com;
    root /root/portal-gundam-tcg-br/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/anaheimhub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anaheimhub.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # compressão de texto (a API já manda JSON compactado; aqui é HTML/JS/CSS/SVG/XML)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # Política de conteúdo em modo SÓ RELATÓRIO: não bloqueia nada; o navegador manda ao Sentry o que
    # seria bloqueado. Depois de umas semanas sem relatório inesperado, troca para Content-Security-Policy.
    set $anaheimhub_csp "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://accounts.google.com https://www.google.com https://www.gstatic.com https://pagead2.googlesyndication.com https://adservice.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss://anaheimhub.com https://cloudflareinsights.com https://*.ingest.us.sentry.io https://accounts.google.com https://www.google.com https://www.gstatic.com https://*.supabase.co https://pagead2.googlesyndication.com; frame-src https://accounts.google.com https://www.google.com https://recaptcha.google.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri https://o4512285592518656.ingest.us.sentry.io/api/4512285603790848/security/?sentry_key=6175b4ddb9ce7103a34f3550645c6313";

    # cabeçalhos de segurança (repetidos nos blocos que definem add_header próprio, senão o nginx descarta)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Content-Security-Policy-Report-Only $anaheimhub_csp always;

    # Frontend: arquivo do build se existir; senão, a API monta a página com título, descrição e imagem de
    # prévia próprios e responde 404 a endereço inexistente (server/htmlMeta.ts)
    location / {
        try_files $uri $uri/index.html $uri/ @app_html;
    }

    location @app_html {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # API fora do ar → entrega o index.html estático como antes (o site continua abrindo)
        proxy_intercept_errors on;
        error_page 502 503 504 = @static_index;
    }

    location @static_index {
        try_files /index.html =503;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy-Report-Only $anaheimhub_csp always;
    }

    # index.html sempre revalidado (aponta para os arquivos novos depois de cada deploy)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy-Report-Only $anaheimhub_csp always;
    }

    # arquivos do build com hash no nome: cache longo
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    # API (inclui o socket do simulador em /api/simulator/socket*, por isso os cabeçalhos de WebSocket)
    location /api/ {
        limit_req zone=anaheimhub_api burst=80 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $anaheimhub_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets: simulador (caminho padrão) e rede social (/social.io — antes caía no index.html)
    location ~ ^/(socket|social)\.io/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $anaheimhub_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Uploads de imagens
    location /uploads/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP → HTTPS (domínio principal)
server {
    listen 80;
    server_name anaheimhub.com www.anaheimhub.com;
    server_tokens off;
    return 301 https://anaheimhub.com$request_uri;
}
