services:
  postgres:
    image: postgres:16-alpine
    container_name: portal-gundam-tcg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gundam_portal
      POSTGRES_USER: gundam
      POSTGRES_PASSWORD: gundam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gundam -d gundam_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
