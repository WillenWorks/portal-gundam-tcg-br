<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
  <title id="t">Hangar do Anaheim Hub recebendo suprimentos</title>
  <desc id="d">Ilustração: um laboratório-hangar do Anaheim Hub. Um robô de manutenção original está na plataforma enquanto um carrinho de carga traz caixas de suprimentos marcadas como servidor, domínio e spoilers.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1222"/>
      <stop offset="1" stop-color="#101c33"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1a2e"/>
      <stop offset="1" stop-color="#060b15"/>
    </linearGradient>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03060f"/>
      <stop offset="1" stop-color="#0b1a36"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.75" stop-color="#1d6fa3"/>
      <stop offset="0.93" stop-color="#58c4e6"/>
      <stop offset="1" stop-color="#58c4e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8edf5"/>
      <stop offset="1" stop-color="#9fb0c8"/>
    </linearGradient>
    <linearGradient id="armorDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4a66"/>
      <stop offset="1" stop-color="#1e293d"/>
    </linearGradient>
    <linearGradient id="crate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a63"/>
      <stop offset="1" stop-color="#25324a"/>
    </linearGradient>
    <pattern id="hazard" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="24" height="24" fill="#111827"/>
      <rect width="12" height="24" fill="#eab308"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- parede do hangar -->
  <rect width="1200" height="600" fill="url(#wall)"/>
  <g stroke="#1b2a45" stroke-width="2">
    <path d="M0 70 H1200 M0 410 H1200"/>
    <path d="M80 70 V410 M200 70 V410 M320 70 V410 M880 70 V410 M1000 70 V410 M1120 70 V410"/>
  </g>
  <!-- vigas do teto -->
  <g fill="#0d1729" stroke="#22324f" stroke-width="2">
    <path d="M0 0 H1200 V36 H0 Z"/>
    <path d="M0 36 L60 70 H1140 L1200 36 Z"/>
  </g>
  <g stroke="#22324f" stroke-width="3">
    <path d="M100 36 L140 70 M300 36 L340 70 M500 36 L540 70 M700 36 L740 70 M900 36 L940 70 M1100 36 L1140 70"/>
  </g>

  <!-- janela para o espaço -->
  <g>
    <rect x="370" y="126" width="460" height="230" rx="6" fill="url(#space)" stroke="#2b3d5f" stroke-width="6"/>
    <circle cx="760" cy="456" r="230" fill="url(#planet)" clip-path="url(#win)"/>
    <clipPath id="win"><rect x="373" y="129" width="454" height="224" rx="4"/></clipPath>
    <g fill="#e2e8f0" clip-path="url(#win)" transform="translate(0 36)">
      <circle cx="410" cy="120" r="1.6"/><circle cx="455" cy="170" r="1.1"/><circle cx="520" cy="110" r="1.4"/>
      <circle cx="575" cy="150" r="1"/><circle cx="610" cy="125" r="1.8"/><circle cx="660" cy="105" r="1.1"/>
      <circle cx="700" cy="160" r="1.3"/><circle cx="790" cy="120" r="1.5"/><circle cx="430" cy="230" r="1.2"/>
      <circle cx="495" cy="270" r="1.6"/><circle cx="560" cy="215" r="1"/><circle cx="805" cy="190" r="1"/>
    </g>
    <!-- colônia distante -->
    <g clip-path="url(#win)" opacity="0.85" transform="translate(0 36)">
      <rect x="455" y="190" width="120" height="12" rx="6" fill="#64748b" transform="rotate(-14 515 196)"/>
      <rect x="470" y="186" width="20" height="20" rx="3" fill="#94a3b8" transform="rotate(-14 515 196)"/>
    </g>
    <path d="M600 126 V356 M370 241 H830" stroke="#2b3d5f" stroke-width="5"/>
  </g>

  <!-- placa -->
  <g>
    <rect x="404" y="78" width="392" height="40" fill="#0b1325" stroke="#38bdf8" stroke-width="2"/>
    <text x="600" y="105" text-anchor="middle" font-family="'Rajdhani','Orbitron','Segoe UI',Arial,sans-serif" font-weight="700" font-size="22" letter-spacing="6" fill="#7dd3fc" filter="url(#glow)">ANAHEIM HUB · LAB</text>
  </g>

  <!-- luzes do teto -->
  <g>
    <path d="M230 70 L150 470 H310 Z" fill="url(#beam)"/>
    <path d="M960 70 L870 470 H1050 Z" fill="url(#beam)"/>
    <rect x="212" y="66" width="36" height="8" rx="2" fill="#bae6fd"/>
    <rect x="942" y="66" width="36" height="8" rx="2" fill="#bae6fd"/>
  </g>

  <!-- chão -->
  <rect y="410" width="1200" height="190" fill="url(#floor)"/>
  <g stroke="#164e63" stroke-width="1.5" opacity="0.7">
    <path d="M0 440 H1200 M0 480 H1200 M0 530 H1200 M0 590 H1200"/>
    <path d="M600 410 V600 M480 410 L380 600 M360 410 L160 600 M240 410 L-60 600 M720 410 L820 600 M840 410 L1040 600 M960 410 L1260 600"/>
  </g>
  <rect y="408" width="1200" height="4" fill="#38bdf8" opacity="0.55"/>

  <!-- ===== plataforma de manutenção (direita) ===== -->
  <g>
    <!-- andaime -->
    <g stroke="#475569" stroke-width="6" fill="none">
      <path d="M800 140 V470 M1110 140 V470"/>
      <path d="M800 230 H1110 M800 330 H1110"/>
      <path d="M800 230 L860 330 M1110 230 L1050 330" stroke-width="3"/>
    </g>
    <rect x="790" y="440" width="330" height="34" fill="url(#hazard)"/>
    <rect x="790" y="470" width="330" height="10" fill="#1f2937"/>

    <!-- robô de manutenção original (do quadril para cima) -->
    <g>
      <!-- braço esquerdo (do robô) -->
      <rect x="1052" y="250" width="44" height="120" rx="10" fill="url(#armor)" stroke="#334155" stroke-width="3"/>
      <rect x="1050" y="365" width="48" height="56" rx="10" fill="url(#armorDark)" stroke="#334155" stroke-width="3"/>
      <!-- braço direito segurando ferramenta -->
      <rect x="812" y="250" width="44" height="110" rx="10" fill="url(#armor)" stroke="#334155" stroke-width="3"/>
      <rect x="808" y="352" width="50" height="52" rx="10" fill="url(#armorDark)" stroke="#334155" stroke-width="3"/>
      <!-- tronco -->
      <path d="M868 230 H1040 L1052 300 L1030 430 H878 L856 300 Z" fill="url(#armor)" stroke="#334155" stroke-width="3"/>
      <!-- escotilha aberta do peito -->
      <rect x="912" y="268" width="84" height="62" rx="6" fill="#0f172a" stroke="#334155" stroke-width="3"/>
      <rect x="922" y="278" width="64" height="8" fill="#38bdf8" opacity="0.8"/>
      <rect x="922" y="294" width="40" height="6" fill="#facc15" opacity="0.8"/>
      <rect x="922" y="306" width="54" height="6" fill="#38bdf8" opacity="0.5"/>
      <path d="M912 268 L896 236 H1012 L996 268" fill="#cbd5e1" stroke="#334155" stroke-width="3"/>
      <!-- faixa no quadril -->
      <rect x="884" y="392" width="140" height="20" fill="url(#hazard)" stroke="#334155" stroke-width="2"/>
      <text x="954" y="374" text-anchor="middle" font-family="'Rajdhani','Segoe UI',Arial,sans-serif" font-weight="700" font-size="22" fill="#1e3a5f">AH-01</text>
      <!-- ombros -->
      <path d="M800 236 Q800 206 836 202 H884 L892 262 H806 Z" fill="url(#armorDark)" stroke="#334155" stroke-width="3"/>
      <path d="M1108 236 Q1108 206 1072 202 H1024 L1016 262 H1102 Z" fill="url(#armorDark)" stroke="#334155" stroke-width="3"/>
      <rect x="822" y="218" width="40" height="8" fill="#38bdf8"/>
      <rect x="1046" y="218" width="40" height="8" fill="#38bdf8"/>
      <!-- cabeça: capacete arredondado com visor horizontal -->
      <rect x="926" y="214" width="56" height="22" fill="#475569"/>
      <path d="M908 214 V170 Q908 140 954 140 Q1000 140 1000 170 V214 Z" fill="url(#armor)" stroke="#334155" stroke-width="3"/>
      <rect x="918" y="172" width="72" height="16" rx="8" fill="#0c4a6e" stroke="#334155" stroke-width="2"/>
      <rect x="924" y="176" width="60" height="8" rx="4" fill="#67e8f9" filter="url(#glow)"/>
      <rect x="944" y="196" width="20" height="8" rx="2" fill="#334155"/>
      <!-- antena de comunicação lateral -->
      <path d="M1000 160 L1024 132" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
      <circle cx="1026" cy="130" r="5" fill="#facc15"/>
    </g>

    <!-- braço mecânico de manutenção com faísca -->
    <g>
      <path d="M1170 70 V120 L1120 170 L1060 186" stroke="#64748b" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="1170" cy="120" r="10" fill="#475569"/>
      <circle cx="1120" cy="170" r="9" fill="#475569"/>
      <g filter="url(#glow)" stroke="#fde68a" stroke-width="3" stroke-linecap="round">
        <path d="M1052 188 l-14 -8 M1052 188 l-16 4 M1052 188 l-8 14 M1052 188 l4 -16"/>
      </g>
    </g>
  </g>

  <!-- ===== entrega de suprimentos (esquerda) ===== -->
  <!-- pilha de caixas já entregues -->
  <g font-family="'Rajdhani','Segoe UI',Arial,sans-serif" font-weight="700" text-anchor="middle">
    <g>
      <rect x="40" y="372" width="150" height="100" fill="url(#crate)" stroke="#64748b" stroke-width="3"/>
      <path d="M40 392 H190 M40 452 H190" stroke="#475569" stroke-width="3"/>
      <rect x="62" y="404" width="106" height="36" fill="#0b1325" stroke="#38bdf8" stroke-width="2"/>
      <text x="115" y="428" font-size="16" fill="#7dd3fc" letter-spacing="1">SERVIDOR</text>
    </g>
    <g>
      <rect x="196" y="392" width="120" height="80" fill="url(#crate)" stroke="#64748b" stroke-width="3"/>
      <path d="M196 410 H316" stroke="#475569" stroke-width="3"/>
      <rect x="214" y="420" width="84" height="32" fill="#0b1325" stroke="#facc15" stroke-width="2"/>
      <text x="256" y="442" font-size="16" fill="#fde047" letter-spacing="1">DOMÍNIO</text>
    </g>
    <g>
      <rect x="70" y="282" width="130" height="90" fill="url(#crate)" stroke="#64748b" stroke-width="3"/>
      <path d="M70 300 H200" stroke="#475569" stroke-width="3"/>
      <rect x="88" y="312" width="94" height="34" fill="#0b1325" stroke="#38bdf8" stroke-width="2"/>
      <text x="135" y="334" font-size="16" fill="#7dd3fc" letter-spacing="1">SPOILERS</text>
    </g>
    <!-- coração de apoio sobre a pilha -->
    <path d="M135 268 C135 252 112 248 112 266 C112 280 135 290 135 296 C135 290 158 280 158 266 C158 248 135 252 135 268 Z" fill="#f43f5e" filter="url(#glow)"/>
  </g>

  <!-- carrinho de carga trazendo mais caixas -->
  <g>
    <!-- trilho de entrada -->
    <rect x="300" y="500" width="460" height="10" fill="#1e293b"/>
    <rect x="300" y="500" width="460" height="3" fill="#38bdf8" opacity="0.6"/>
    <!-- carrinho -->
    <g transform="translate(470 0)">
      <rect x="0" y="440" width="200" height="56" rx="8" fill="url(#armorDark)" stroke="#64748b" stroke-width="3"/>
      <rect x="0" y="462" width="200" height="10" fill="url(#hazard)"/>
      <!-- cabine do carrinho -->
      <path d="M200 496 V418 Q200 404 214 404 H244 Q258 404 258 418 V496 Z" fill="url(#armor)" stroke="#334155" stroke-width="3"/>
      <rect x="212" y="414" width="34" height="22" rx="4" fill="#0c4a6e"/>
      <rect x="216" y="420" width="26" height="6" rx="3" fill="#67e8f9" filter="url(#glow)"/>
      <circle cx="40" cy="500" r="16" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
      <circle cx="160" cy="500" r="16" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
      <circle cx="232" cy="500" r="14" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
      <circle cx="40" cy="500" r="5" fill="#38bdf8"/><circle cx="160" cy="500" r="5" fill="#38bdf8"/><circle cx="232" cy="500" r="5" fill="#38bdf8"/>
      <!-- caixas no carrinho -->
      <g font-family="'Rajdhani','Segoe UI',Arial,sans-serif" font-weight="700" text-anchor="middle">
        <rect x="12" y="370" width="96" height="70" fill="url(#crate)" stroke="#64748b" stroke-width="3"/>
        <path d="M12 386 H108" stroke="#475569" stroke-width="3"/>
        <path d="M60 396 v34 M43 413 h34" stroke="#4ade80" stroke-width="9" stroke-linecap="round"/>
        <rect x="114" y="390" width="78" height="50" fill="url(#crate)" stroke="#64748b" stroke-width="3"/>
        <text x="153" y="424" font-size="22" fill="#fde047">R$</text>
        <rect x="30" y="322" width="70" height="48" fill="url(#crate)" stroke="#64748b" stroke-width="3"/>
        <path d="M65 334 v26 M52 347 h26" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
      </g>
      <!-- luz de alerta girando -->
      <rect x="222" y="396" width="14" height="8" fill="#facc15" filter="url(#glow)"/>
    </g>
    <!-- marcas de movimento -->
    <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.5">
      <path d="M380 452 H440 M400 472 H452 M370 432 H420"/>
    </g>
  </g>

  <!-- painel de status na parede -->
  <g font-family="'Rajdhani','Segoe UI',Arial,sans-serif" font-weight="700">
    <rect x="236" y="250" width="120" height="78" fill="#0b1325" stroke="#334155" stroke-width="3"/>
    <text x="248" y="272" font-size="13" fill="#94a3b8" letter-spacing="1">SUPRIMENTOS</text>
    <rect x="248" y="284" width="96" height="10" fill="#1e293b"/>
    <rect x="248" y="284" width="64" height="10" fill="#4ade80"/>
    <rect x="248" y="302" width="96" height="10" fill="#1e293b"/>
    <rect x="248" y="302" width="40" height="10" fill="#facc15"/>
  </g>
</svg>
